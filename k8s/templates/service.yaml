apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{ range $k, $v := .Values.labels }}
    {{ $k }}: "{{ $v }}"
    {{ end }}
  annotations:
    # FIXME: Disabled, see deployment
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "9113"
    {{ range $k, $v := .Values.annotations }}
    {{ $k }}: "{{ $v }}"
    {{ end }}
spec:
  selector:
    {{ range $k, $v := .Values.labels }}
    {{ $k }}: "{{ $v }}"
    {{ end }}
  # Required for GKE ingress LB
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  # FIXME: Disabled, see deployment
  # - name: metrics
  #   port: 9113
  #   targetPort: 9113
  #   protocol: TCP
