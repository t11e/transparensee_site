<html>
  <head>
    <title>Login - Discovery Engine Monitor</title>
    <link rel="stylesheet" href="http://monitor.transparensee.com/static/css/old_style.css" media="screen" rel="Stylesheet" type="text/css" />
    <link rel="shortcut icon" href="http://monitor.transparensee.com/static/favicon.jpg" />
  </head>
  <body>
    <div id='authpage'>
      <h1>Discovery Server Monitor</h1>
        <h2>Login</h2>
        <p>
          We are about to redirect you to Google to perform the login.
          If you are not redirected automatically, click the button below to continue to Google.
        </p>
      <form id="googleopenidredirect" name="googleopenid" action="http://monitor.transparensee.com/j_spring_openid_security_check" method="post">
        <input name="openid_identifier" type="hidden" value="https://www.google.com/accounts/o8/id"/>
        <input type="submit" value="Sign in with Google" class="submit"/>
      </form>
    </div>
      <script type="text/javascript"><!-- //
        document.forms['googleopenidredirect'].submit();
      //--></script>
  </body>
</html>
